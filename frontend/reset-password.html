<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Kashmir Yatra</title>
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/font-awesome.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/admin-login.css">
</head>

<body>

    <div class="login-page-wrapper">
        <div class="login-card">
            <div class="login-card-left">
                <div class="overlay-content">
                    <img src="assets/img/logo kashmir yatra.webp" alt="Kashmir Yatra" class="card-logo">
                    <h2>Kashmir Yatra</h2>
                    <p>Secure your account with a new password.</p>
                </div>
            </div>

            <div class="login-card-right">
                <div class="form-header">
                    <h3>Reset Password</h3>
                    <p>Enter your new password below</p>
                </div>

                <form id="resetForm">
                    <div class="input-group-custom">
                        <label for="password">New Password</label>
                        <div class="input-field">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="password" placeholder="••••••••••••" required minlength="6">
                        </div>
                    </div>

                    <div class="input-group-custom">
                        <label for="confirmPassword">Confirm New Password</label>
                        <div class="input-field">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="confirmPassword" placeholder="••••••••••••" required
                                minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn-login-card">UPDATE PASSWORD</button>

                    <div class="text-center mt-4">
                        <a href="admin-login.html" class="forgot-password-link">Back to Login</a>
                    </div>
                </form>
                <div id="message" class="text-center mt-3" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/reset-password.js" defer></script>
</body>

</html>
