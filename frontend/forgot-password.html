<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Kashmir Yatra</title>
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/font-awesome.css">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/admin-login.css">
</head>

<body>

    <div class="login-page-wrapper">
        <div class="login-card">
            <div class="login-card-left">
                <div class="overlay-content">
                    <img src="assets/img/logo kashmir yatra.webp" alt="Kashmir Yatra" class="card-logo">
                    <h2>Kashmir Yatra</h2>
                    <p>Recover your access to the admin dashboard.</p>
                </div>
            </div>

            <div class="login-card-right">
                <div class="form-header">
                    <h3>Forgot Password</h3>
                    <p>Enter your email to receive a reset link</p>
                </div>

                <form id="forgotForm">
                    <div class="input-group-custom">
                        <label for="email">Email Address</label>
                        <div class="input-field">
                            <i class="fas fa-envelope"></i>
                            <input type="email" id="email" placeholder="admin@kashmiryatra.com" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-login-card">SEND RESET LINK</button>

                    <div class="text-center mt-4">
                        <a href="admin-login.html" class="forgot-password-link"><i
                                class="fas fa-arrow-left me-2"></i>Back to Login</a>
                    </div>
                </form>
                <div id="message" class="text-center mt-3" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="assets/js/config.js" defer></script>
    <script src="assets/js/forgot-password.js" defer></script>
</body>

</html>
